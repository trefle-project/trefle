# 012-url-page-import — static source site for import tests (e2e fixture
# service `import-fixture`, infra/docker-compose.override.yml).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # test:browser: the page itself redirects to an internal address.
  location = /redirect-internal { return 302 http://cms:3000/; }
  # test:browser: a page redirect the import follows to its target.
  location = /redirect-home { return 301 /index.html; }
  # test:browser: a refusal from a bot-protection service vs a members-only page.
  location = /blocked-waf { add_header cf-ray "a41c-CDG" always; return 403; }
  location = /members { return 403; }
  # test:browser: the page shows the User-Agent the import's browser sent.
  location = /ua { default_type text/html; return 200 "<!doctype html><html><body><h1>Agent</h1><p>$http_user_agent</p></body></html>"; }
  # test:browser: sub-resource redirects, to an internal address and to the site itself.
  location = /img/redirect-internal.png { return 302 http://cms:3000/logo.png; }
  location = /img/redirect-ok.jpg { return 302 /img/fond.jpg; }

  # 015-penpot-site-import (domain fonts) — a stand-in for the Google Fonts
  # CSS2 API, used when the cms has GOOGLE_FONTS_CSS_URL=http://import-fixture/css2
  # (CI). Knows EB Garamond 400 only; any other family or weight → 400, like Google.
  location = /css2 {
    default_type text/css;
    if ($arg_family !~* "^EB\+Garamond(:ital,wght@0,400|:wght@400)?$") { return 400; }
    try_files /fonts/css2-eb-garamond.css =404;
  }

  location / { try_files $uri $uri/ =404; }
}
