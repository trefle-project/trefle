<svg xmlns="http://www.w3.org/2000/svg" viewBox="46 41 420 420" width="512" height="512">
  <title>Trèfle</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#0F4A2C"/>
      <stop offset="1" stop-color="#062616"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="-185" x2="0" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14935F"/>
      <stop offset="1" stop-color="#006A4E"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <path id="heart" d="M0,0 C-20,-20 -90,-60 -90,-120 C-90,-160 -60,-185 -30,-185 C-12,-185 0,-172 0,-160 C0,-172 12,-185 30,-185 C60,-185 90,-160 90,-120 C90,-60 20,-20 0,0 Z"/>
