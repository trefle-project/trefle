# Contributor License Agreement check (CLA.md). A contributor signs once by
# commenting the sentence the bot asks for; signatures are stored on the
# `cla-signatures` branch, so `main` can stay protected.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/trefle-project/trefle/blob/main/CLA.md
          branch: cla-signatures
          allowlist: dependabot[bot],kiaitutoi
